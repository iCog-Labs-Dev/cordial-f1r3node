# Four-node Cordial Miners real-cluster overrides.
#
# This config is for a connected local shard-style network:
# one bootstrap node plus four bonded validators.

standalone = false
dev-mode = true
consensus = "cordial-miners"

protocol-server {
  network-id = "cordial-real-four-node"
  allow-private-addresses = true
  no-upnp = true
}

casper {
  fault-tolerance-threshold = 0.0
  validator-public-key = ${?CORDIAL_NODE_VALIDATOR_PUBLIC_KEY}
  validator-private-key = ${?CORDIAL_NODE_VALIDATOR_PRIVATE_KEY}
  synchrony-constraint-threshold = 0.0
  casper-loop-interval = 750 ms
  requested-blocks-timeout = 10 seconds
  fork-choice-stale-threshold = 1 minutes
  fork-choice-check-if-stale-interval = 20 seconds
  max-number-of-parents = 100
  enable-mergeable-channel-gc = true

  heartbeat {
    enabled = true
    check-interval = 5 seconds
    max-lfb-age = 5 seconds
  }

  genesis-ceremony {
    required-signatures = 3
    approve-interval = 10 seconds
    approve-duration = 1 minutes
  }

  genesis-block-data {
    native-token-name = ${?NATIVE_TOKEN_NAME}
    native-token-symbol = ${?NATIVE_TOKEN_SYMBOL}
    native-token-decimals = ${?NATIVE_TOKEN_DECIMALS}
    number-of-active-validators = 4
    pos-multi-sig-quorum = 3
    epoch-length = 10
    quarantine-length = 10
  }
}

metrics {
  prometheus = true
}
