# Four-node Cordial Miners local-intercept demo overrides.
# This is a logic-prototype demo: four f1r3node runtimes use the Cordial
# adapter locally and compare their ordered views. The multi-validator safety
# proof remains covered by the conformance test suite.

standalone = true
dev-mode = true
consensus = "cordial-miners"

protocol-server {
  network-id = "cordial-demo-four-node"
  allow-private-addresses = true
  no-upnp = true
}

casper {
  fault-tolerance-threshold = 0.0
  synchrony-constraint-threshold = 0.0
  casper-loop-interval = 5 seconds
  requested-blocks-timeout = 60 seconds
  fork-choice-stale-threshold = 30 seconds
  fork-choice-check-if-stale-interval = 1 minutes
  max-number-of-parents = 100
  enable-mergeable-channel-gc = true

  heartbeat {
    enabled = false
  }

  genesis-ceremony {
    required-signatures = 0
    approve-interval = 1 seconds
    approve-duration = 1 seconds
    autogen-shard-size = 1
    ceremony-master-mode = true
  }

  genesis-block-data {
    native-token-name = ${?NATIVE_TOKEN_NAME}
    native-token-symbol = ${?NATIVE_TOKEN_SYMBOL}
    native-token-decimals = ${?NATIVE_TOKEN_DECIMALS}
    number-of-active-validators = 1
    pos-multi-sig-quorum = 1
  }
}

metrics {
  prometheus = true
}
