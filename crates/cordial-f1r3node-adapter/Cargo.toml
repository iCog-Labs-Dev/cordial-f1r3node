[package]
name = "cordial-f1r3node-adapter"
description = "f1r3node integration adapter for the blocklace crate: Casper trait, block translation, and real RSpace runtime binding"
version.workspace = true
edition.workspace = true

[dependencies]
cordial-miners-core = { path = "../cordial-miners-core" }
cordial-por = { path = "../cordial-por" }
cordial-f1r3space-adapter = { path = "../cordial-f1r3space-adapter" }
cordial-app-runtime = { path = "../cordial-app-runtime" }

# Shared deps we use internally for translation, hashing, etc.
sha2.workspace = true
serde.workspace = true
bincode.workspace = true
anyhow.workspace = true
prost.workspace = true
tonic.workspace = true
reqwest.workspace = true
serde_json.workspace = true
hex.workspace = true
tokio-stream.workspace = true

# Phase 3.4 — crypto alignment with f1r3node.
blake2.workspace = true
k256.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true

# Phase 3.1 — Casper trait adapter
async-trait.workspace = true
either.workspace = true
tokio.workspace = true
clap = { version = "4.6", features = ["derive"] }

casper = { path = "../../../f1r3node-rust/casper" }
crypto = { path = "../../../f1r3node-rust/crypto" }
models = { path = "../../../f1r3node-rust/models" }
block-storage = { path = "../../../f1r3node-rust/block-storage" }

# ── HTTP deploy ingress server ──────────────────────────────────────────────
axum.workspace = true

# ── logging ───────────────────────────────────────────────────────────────
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

# ── error handling ────────────────────────────────────────────────────────
thiserror    = "1"

[dev-dependencies]
cordial-miners-core = { path = "../cordial-miners-core", features = ["bench-support"] }
# Public APIs used by the untimed RSpace benchmark bootstrap.
rholang = { path = "../../../f1r3node-rust/rholang" }
rspace_plus_plus = { path = "../../../f1r3node-rust/rspace++" }
shared = { path = "../../../f1r3node-rust/shared" }
tempfile  = "3"
heed      = "0.20"
criterion = { version = "0.5", features = ["html_reports"] }
tower     = { version = "0.5", features = ["util"] }

[[bench]]
name = "ordered_output"
harness = false

[[bench]]
name = "block_translation"
harness = false

[[bench]]
name = "lmdb_persistence"
harness = false

[[bench]]
name = "startup_recovery"
harness = false

[[bench]]
name = "execution"
harness = false

[[bench]]
name = "por_checkpoint"
harness = false
