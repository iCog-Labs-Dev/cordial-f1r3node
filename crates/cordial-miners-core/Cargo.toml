[package]
name = "cordial-miners-core"
description = "Cordial Miners consensus on a blocklace DAG"
version.workspace = true
edition.workspace = true

# Enable consensus event tracing. Zero overhead when absent.
# Activate with: cargo test --features trace
[features]
trace = []
# Deliberately incorrect quorum rule used only by the Issue #188 mutation
# harness. Never enable this feature in a production build.
trace-threshold-mutation = ["trace"]

[dependencies]
sha2.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
tokio.workspace = true
serde.workspace = true
bincode.workspace = true
blake2.workspace = true
k256.workspace = true
serde_json.workspace = true

[dev-dependencies]
proptest = "1"
