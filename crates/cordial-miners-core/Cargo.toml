[package]
name = "cordial-miners-core"
description = "Cordial Miners consensus on a blocklace DAG"
version.workspace = true
edition.workspace = true

# Enable consensus event tracing. Zero overhead when absent.
# Activate with: cargo test --features trace
[features]
trace = []
# Enabled through dev-dependencies for benchmark fixture reuse only.
bench-support = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(cordial_trace_threshold_mutation)"] }

[dependencies]
sha2.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
tokio.workspace = true
serde.workspace = true
bincode.workspace = true
blake2.workspace = true
k256.workspace = true
serde_json.workspace = true

[dev-dependencies]
cordial-miners-core = { path = ".", features = ["bench-support"] }
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "leader_lookup"
harness = false

[[bench]]
name = "tau_ordering"
harness = false

[[bench]]
name = "height_bootstrap"
harness = false

[[bench]]
name = "dag_traversal"
harness = false

[[bench]]
name = "pruning_gc"
harness = false

[[bench]]
name = "block_validation"
harness = false

[[bench]]
name = "proposer_selection"
harness = false

[[bench]]
name = "consensus_scenarios"
harness = false

[[bench]]
name = "deploy_pool"
harness = false
