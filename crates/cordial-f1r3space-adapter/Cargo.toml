[package]
name = "cordial-f1r3space-adapter"
description = "Real RSpace-backed RuntimeManager adapter: delegates blocklace::execution::RuntimeManager to f1r3node's RuntimeManager for actual Rholang execution"
version.workspace = true
edition.workspace = true

[dependencies]
'cordial-miners-core' = { path = "../cordial-miners-core" }


# ───────────────────────────────────────────────────────────────────────
# f1r3node-rust path dependencies. Keep the new node checkout beside this
# workspace at ../f1r3node-rust.
# ───────────────────────────────────────────────────────────────────────
models = { path = "../../../f1r3node-rust/models" }
casper = { path = "../../../f1r3node-rust/casper", features = ["test-utils"] }
rholang = { path = "../../../f1r3node-rust/rholang" }
rspace_plus_plus = { path = "../../../f1r3node-rust/rspace++" }
crypto = { path = "../../../f1r3node-rust/crypto" }
shared = { path = "../../../f1r3node-rust/shared" }

# Direct deps we use in translation code. All come transitively via
# f1r3node anyway; listing them explicitly keeps the imports working.
prost.workspace = true
tokio.workspace = true

# LMDB — same library F1R3FLY uses in rspace_store_manager.rs
heed      = "0.20"

# Binary serialization for Block ↔ bytes
bincode   = "1.3"
serde     = { version = "1", features = ["derive"] }

# Structured errors
thiserror = "1"

# Logging in recovery path
tracing   = "0.1"

[dev-dependencies]

tempfile = "3"
tracing-subscriber = "0.3"

# Needed for #[tokio::test] in test_e2e_execution.rs
tokio = { version = "1", features = ["full"] }
